<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gerome's Gnomish Spell Book</title>
        <style>@import url('https://fonts.cdnfonts.com/css/draconis');</style>
        <link rel="stylesheet" href="https://unpkg.com/papercss@1.9.2/dist/paper.min.css"/>
        <link rel="stylesheet" href="./css/styles.css"/>
    </head>

    <body class="paper" id="grid-container">
        <header id="header">
            <h1>Gerome's Gnomish Spell Book</h1>
            <div class="backlink"><a href="./index.html">&larr; Back to Character Sheet</a></div>
        </header>

        <nav id="nav">

            <div id="searchBar">
                <input type="text" placeholder="Search spells, text, source..." id="txtSearch" onkeyup="searchSpells()"></div>

            <div class="filterGroup">
                <span class="filterLabel">Level</span>
                <div id="navList"></div>
            </div>

            <div class="filterGroup">
                <span class="filterLabel">Class</span>
                <div id="classList"></div>
            </div>
        </nav>

        <main id="main">
            <div class="row" id="spellList"></div>
        </main>

        <footer id="footer">
        </footer>
        <script src="js/app.js"></script>
        <script src="data/spells.js"></script>
    </body>
</html>
